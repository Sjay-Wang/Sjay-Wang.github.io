name: Update Google Scholar citations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-scholar-citations.yml"
      - "google_scholar_crawler/**"
  schedule:
    # Run daily at 08:00 UTC (16:00 Asia/Shanghai).
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        env:
          GOOGLE_SCHOLAR_ID: jeJeXVYAAAAJ
        run: python google_scholar_crawler/main.py

      - name: Publish citation data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: google_scholar_crawler/results
        run: |
          git init --initial-branch=google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update Google Scholar citation data"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
